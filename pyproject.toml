[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfdots"
version = "0.5.0"
description = "Prepare printer and cutter PDFs with registration dots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pikepdf>=9.0",
    "PySide6>=6.7",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.11",
]

[project.scripts]
pdfdots = "pdfdots.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
